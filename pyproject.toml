[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ustb-cli"
version = "0.1.0"
description = "北京科技大学本研一体化教务 CLI"
requires-python = ">=3.10"
dependencies = ["requests>=2.32,<3", "Pillow>=10,<13"]

[project.scripts]
cli = "ustb_cli.app:main"
ustb = "ustb_cli.app:main"

[project.optional-dependencies]
build = ["pyinstaller>=6,<7"]

[tool.setuptools.packages.find]
include = ["ustb_cli*"]
